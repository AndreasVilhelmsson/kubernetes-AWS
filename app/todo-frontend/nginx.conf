server {
  listen 80;
  server_name _;

  root   /usr/share/nginx/html;
  index  index.html;

  # SPA: servera index.html för alla okända paths
  location / {
    try_files $uri $uri/ /index.html;
  }

  # (Valfritt) Om du vill testa front + backend lokalt på EN port via NGINX:
  # Avkommentera blocket nedan och kör backend på host.docker.internal:8090
  # location /api/ {
  #   proxy_pass http://host.docker.internal:8090;
  #   proxy_set_header Host $host;
  #   proxy_set_header X-Real-IP $remote_addr;
  #   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #   proxy_http_version 1.1;
  # }
}